# Application-role defaults installed to ~/.config/devuan-machine-config/apps.conf by every profile.
# One executable name per role; use a command available in PATH.
keyboard-indicator=gxkb
network-tray=nm-applet
power-manager=xfce4-power-manager
screensaver=xfce4-screensaver
notifications=dunst
audio-tray=pasystray
bluetooth-tray=blueman-applet
terminal=xterm
file-manager=thunar
browser=firefox
editor=mousepad
image-viewer=feh
pdf-viewer=evince
media-player=vlc
music-streaming=youtube-music
cloud-storage=rclone
